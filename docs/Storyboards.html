<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Syne+Mono&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <title>Storyboards</title>

    <link rel="stylesheet" href="./Stylesheet.css">
   
</head>

<body class="bodyfix">
    <header>
        <h1 class="syne-mono-regular">Spells 'n Glitches</h1>
        <p>Bem-vindo ao site de apresentação dos storyboards do nosso jogo de lógica.</p>
    </header>
    <nav>
        <a href="Livro.html">Livro</a>
        <a href="Vídeo.html">Vídeo</a>
        <a href="index.html">Site Principal</a>>
    </nav>

    <main class="main_legal">
        <div class="primarybox">
            <h1>Storyboards</h1>
        
            <div id="storyboardCarousel" class="carousel slide carousel-dark codigo-carousel" data-bs-ride="carousel">
                
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="imagens/Stry1.png" class="d-block w-100" alt="Storyboard 1">
                    </div>
                    <div class="carousel-item">
                        <img src="imagens/Stry2.png" class="d-block w-100" alt="Storyboard 2">
                    </div>
                    <div class="carousel-item">
                        <img src="imagens/Stry3.png" class="d-block w-100" alt="Storyboard 3">
                    </div>
                    <div class="carousel-item">
                        <img src="imagens/Stry4.png" class="d-block w-100" alt="Storyboard 4">
                    </div>
                    <div class="carousel-item">
                        <img src="imagens/Stry5.png" class="d-block w-100" alt="Storyboard 5">
                    </div>
                    <div class="carousel-item">
                        <img src="imagens/Stry6.png" class="d-block w-100" alt="Storyboard 6">
                    </div>
                </div>

                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#storyboardCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Storyboard 1"></button>
                    <button type="button" data-bs-target="#storyboardCarousel" data-bs-slide-to="1" aria-label="Storyboard 2"></button>
                    <button type="button" data-bs-target="#storyboardCarousel" data-bs-slide-to="2" aria-label="Storyboard 3"></button>
                    <button type="button" data-bs-target="#storyboardCarousel" data-bs-slide-to="3" aria-label="Storyboard 4"></button>
                    <button type="button" data-bs-target="#storyboardCarousel" data-bs-slide-to="4" aria-label="Storyboard 5"></button>
                    <button type="button" data-bs-target="#storyboardCarousel" data-bs-slide-to="5" aria-label="Storyboard 6"></button>
                </div>

                <button class="carousel-control-prev" type="button" data-bs-target="#storyboardCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#storyboardCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Próximo</span>
                </button>

                

            </div>
            <div class="pdf">
                <h2>Veja o Storyboard</h2>

                <a href="./Storyboard.pdf" target="_blank">
                    ABRIR STORYBOARD
                </a>
            </div>
            <a href="index.html" class="voltar">Voltar</a>
        </div>
    </main>

        <table>

                <th>Nicolas Salatini</th>
            </tr>
        </table>
        <p>DS 131 - IFSP SPO - 2026</p>

    </footer>

</html>
